<script>
(function(){
  var box=document.getElementById("pd-install"), go=document.getElementById("pd-install-go"), x=document.getElementById("pd-install-x"), txt=document.getElementById("pd-install-text"), ev=null;
  function standalone(){return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;}
  function dismissed(){try{return localStorage.getItem("pd1_install_dismissed")==="1";}catch(e){return false;}}
  function show(){ if(standalone()||dismissed()) return; box.style.display="flex"; }
  x.onclick=function(){box.style.display="none";try{localStorage.setItem("pd1_install_dismissed","1");}catch(e){}};
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();ev=e;txt.textContent="Install app on this device";go.textContent="Install";show();});
  go.onclick=function(){ if(ev){ev.prompt();ev.userChoice.then(function(){box.style.display="none";ev=null;});} else {alert("To install: tap the Share button, then Add to Home Screen.");} };
  window.addEventListener("appinstalled",function(){box.style.display="none";});
  var ua=navigator.userAgent||""; var ios=/iPad|iPhone|iPod/.test(ua)&&!window.MSStream;
  if(ios&&!standalone()){ txt.textContent="Add to Home Screen"; go.textContent="How"; setTimeout(show,1200); }
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
</script>
</body>
</html>
